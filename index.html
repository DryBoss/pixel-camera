<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Pixel Cam</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e1626;--wood:#8a5a35;--woodDark:#3b2314;--parch:#f2d9a0;--accent:#e8c04a;--ink:#f6ecd2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Silkscreen',ui-monospace,Menlo,monospace}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;background:var(--bg)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(30,12,30,.5) 100%)}
.panel{background:var(--parch);color:var(--woodDark);border:4px solid var(--woodDark);outline:4px solid var(--wood);outline-offset:-8px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;padding:10px 14px;font-size:13px;line-height:1.5;text-align:center}
#hud b{font-size:16px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--wood);border-top:4px solid var(--woodDark);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center}
#bar button{font:inherit;font-size:14px;color:var(--woodDark);background:var(--parch);border:3px solid var(--woodDark);padding:8px 12px;cursor:pointer}
#bar button[aria-pressed="true"]{background:var(--accent);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.group{display:flex;gap:6px}
label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--parch)}
input[type=range]{accent-color:var(--accent);width:110px}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:linear-gradient(#2c2140,#1e1626)}
#gate h1{margin:0;font-size:clamp(30px,9vw,58px);line-height:1.1;color:var(--accent);text-shadow:4px 4px 0 var(--woodDark)}
#gate p{margin:0;max-width:34ch;font-size:15px;line-height:1.5;color:#cdbfdc}
#start{font:inherit;font-size:20px;font-weight:700;color:var(--woodDark);background:var(--accent);border:4px solid var(--woodDark);padding:14px 26px;cursor:pointer;box-shadow:0 6px 0 var(--woodDark)}
#start:active{transform:translateY(4px);box-shadow:0 2px 0 var(--woodDark)}
#err{color:#ff9a8a;min-height:1.2em;max-width:36ch;font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vig"></div>
<div id="hud" class="panel hide"><b id="season">Spring 12</b><br><span id="clock">6:00 am</span></div>
<div id="bar" class="hide">
  <div class="group" role="group" aria-label="Time of day">
    <button data-mode="day" aria-pressed="true">Day</button>
    <button data-mode="sunset" aria-pressed="false">Sunset</button>
    <button data-mode="night" aria-pressed="false">Night</button>
  </div>
  <label>Pixels <input id="size" type="range" min="5" max="24" value="9"></label>
  <button id="flip">Flip camera</button>
</div>
<div id="gate">
  <h1>Cozy Pixel Cam</h1>
  <p>Your camera becomes a cozy farm-game world: grass, water, warm light and fireflies. Video stays on your device.</p>
  <button id="start">Start camera</button>
  <div id="err" role="alert"></div>
</div>
<script>
(function(){
  var canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{willReadFrequently:true});
  var video=document.createElement('video');video.playsInline=true;video.muted=true;
  var gate=document.getElementById('gate'),bar=document.getElementById('bar'),hud=document.getElementById('hud'),err=document.getElementById('err');
  var mode='day',cell=9,facing='user',stream=null,sw=0,sh=0,prev=null,flies=[];
  // [r,g,b,group] group 0 grass, 1 water, 2 earth, 3 other
  var PAL=[[38,70,46,0],[63,104,52,0],[95,142,60,0],[140,180,78,0],[184,210,104,0],
    [34,74,112,1],[62,120,164,1],[110,170,208,1],[170,215,232,1],
    [52,34,30,2],[88,58,40,2],[132,90,58,2],[178,130,84,2],[214,172,118,2],
    [74,70,84,3],[124,120,124,3],[178,172,164,3],[232,220,190,3],[255,246,222,3],
    [188,112,84,3],[226,156,118,3],[246,200,160,3],
    [164,58,58,3],[214,96,80,3],[232,140,158,3],[232,192,74,3],
    [30,22,38,3],[66,52,86,3]];
  var GRADE={day:{s:1.3,r:1.06,g:1.03,b:.9,a:8},sunset:{s:1.3,r:1.22,g:1,b:.76,a:4},night:{s:1.1,r:.68,g:.8,b:1.15,a:-8}};
  var BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  var FLOWERS=[[255,255,240],[255,150,180],[255,220,90]];

  function resize(){
    sw=Math.max(16,Math.ceil(window.innerWidth/cell));sh=Math.max(16,Math.ceil(window.innerHeight/cell));
    canvas.width=sw;canvas.height=sh;prev=null;
    flies=[];for(var i=0;i<28;i++)flies.push({x:Math.random()*sw,y:Math.random()*sh,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,ph:Math.random()*6.28});
  }
  function clamp(v){return v<0?0:v>255?255:v}
  function hash(x,y){return(((x*73856093)^(y*19349663))>>>0)}

  function draw(){
    requestAnimationFrame(draw);
    if(video.readyState<2||!video.videoWidth)return;
    var t=performance.now()/1000,vw=video.videoWidth,vh=video.videoHeight;
    var ca=sw/sh,va=vw/vh,sx=0,sy=0,sWid=vw,sHei=vh;
    if(va>ca){sWid=vh*ca;sx=(vw-sWid)/2}else{sHei=vw/ca;sy=(vh-sHei)/2}
    ctx.save();
    if(facing==='user'){ctx.translate(sw,0);ctx.scale(-1,1)}
    ctx.drawImage(video,sx,sy,sWid,sHei,0,0,sw,sh);
    ctx.restore();
    var img=ctx.getImageData(0,0,sw,sh),d=img.data,n=sw*sh,i,p,G=GRADE[mode],night=mode==='night';
    if(!prev){prev=new Float32Array(d.length);for(i=0;i<d.length;i++)prev[i]=d[i]}
    var lum=new Float32Array(n);
    // 1) smooth over time, then colour-grade
    for(i=0;i<n;i++){
      p=i*4;
      var r=prev[p]=prev[p]*.55+d[p]*.45,g=prev[p+1]=prev[p+1]*.55+d[p+1]*.45,b=prev[p+2]=prev[p+2]*.55+d[p+2]*.45;
      var L=.299*r+.587*g+.114*b;
      r=L+(r-L)*G.s;g=L+(g-L)*G.s;b=L+(b-L)*G.s;
      r=r*G.r+G.a;g=g*G.g+G.a;b=b*G.b+G.a;
      if(night&&L>170){var k=Math.min(1,(L-170)/60)*.7;r+=(255-r)*k;g+=(205-g)*k;b+=(120-b)*k}
      d[p]=r;d[p+1]=g;d[p+2]=b;lum[i]=.299*r+.587*g+.114*b;
    }
    // 2) outline, dither, snap to cozy palette, add material texture
    for(i=0;i<n;i++){
      p=i*4;var x=i%sw,y=(i/sw)|0;
      var edge=Math.abs(lum[i]-(x<sw-1?lum[i+1]:lum[i]))+Math.abs(lum[i]-(i+sw<n?lum[i+sw]:lum[i]));
      var cr,cg,cb,grp=3;
      if(edge>36){cr=night?24:42;cg=night?20:28;cb=night?36:34}
      else{
        var dt=(BAYER[(y&3)*4+(x&3)]/16-.5)*30,
            R=d[p]+dt,Gc=d[p+1]+dt,B=d[p+2]+dt,best=1e12,bi=0;
        for(var j=0;j<PAL.length;j++){
          var c=PAL[j],dr=R-c[0],dg=Gc-c[1],db=B-c[2],e=2*dr*dr+4*dg*dg+3*db*db;
          if(e<best){best=e;bi=j}
        }
        var q=PAL[bi];cr=q[0];cg=q[1];cb=q[2];grp=q[3];
        var h=hash(x,y);
        if(grp===0){
          var m=h%13;
          if(m===0){cr+=34;cg+=38;cb+=14}else if(m===1){cr-=26;cg-=28;cb-=14}
          if(h%101===7){var f=FLOWERS[(h>>8)%3];cr=f[0];cg=f[1];cb=f[2]}
        }else if(grp===1){
          if(((x+y*2+Math.floor(t*3))%11)===0){cr+=40;cg+=40;cb+=34}
        }else if(grp===2&&h%9===0){cr-=18;cg-=16;cb-=14}
        if(night&&grp!==3){cr*=.9;cb=Math.min(255,cb*1.08)}
      }
      d[p]=clamp(cr);d[p+1]=clamp(cg);d[p+2]=clamp(cb);d[p+3]=255;
    }
    ctx.putImageData(img,0,0);
    // 3) fireflies / pollen
    var count=night?28:(mode==='sunset'?14:8);
    for(i=0;i<count;i++){
      var f2=flies[i];if(!f2)continue;
      f2.x+=f2.vx+Math.sin(t+f2.ph)*.04;f2.y+=f2.vy+Math.cos(t*.8+f2.ph)*.04;
      if(f2.x<0)f2.x=sw;if(f2.x>sw)f2.x=0;if(f2.y<0)f2.y=sh;if(f2.y>sh)f2.y=0;
      var pulse=(Math.sin(t*2+f2.ph*3)+1)/2,fx=Math.floor(f2.x),fy=Math.floor(f2.y);
      if(night){
        ctx.fillStyle='rgba(255,220,110,'+(.15+.25*pulse)+')';
        ctx.fillRect(fx-1,fy,3,1);ctx.fillRect(fx,fy-1,1,3);
        ctx.fillStyle='rgba(255,248,170,'+(.6+.4*pulse)+')';ctx.fillRect(fx,fy,1,1);
      }else{
        ctx.fillStyle='rgba(255,246,200,'+(.35+.4*pulse)+')';ctx.fillRect(fx,fy,1,1);
      }
    }
  }

  function updateClock(){
    var now=new Date(),h=now.getHours(),m=now.getMinutes(),ap=h>=12?'pm':'am';
    h=h%12||12;document.getElementById('clock').textContent=h+':'+(m<10?'0':'')+m+' '+ap;
    document.getElementById('season').textContent='Spring '+now.getDate();
  }

  function start(){
    err.textContent='';
    if(stream)stream.getTracks().forEach(function(t){t.stop()});
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){err.textContent='No camera access here. Open this page over HTTPS or on localhost.';return}
    navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(s){
      stream=s;video.srcObject=s;return video.play();
    }).then(function(){gate.classList.add('hide');bar.classList.remove('hide');hud.classList.remove('hide');updateClock()})
    .catch(function(e){
      err.textContent=(e&&e.name==='NotAllowedError')?'Camera blocked. Allow camera for this page (lock icon in the address bar), then tap Start camera.':'Could not open the camera. Close other apps using it.';
    });
  }

  document.getElementById('start').onclick=start;
  document.getElementById('flip').onclick=function(){facing=facing==='user'?'environment':'user';start()};
  document.getElementById('size').oninput=function(e){cell=+e.target.value;resize()};
  bar.querySelectorAll('[data-mode]').forEach(function(btn){
    btn.onclick=function(){mode=btn.dataset.mode;bar.querySelectorAll('[data-mode]').forEach(function(b){b.setAttribute('aria-pressed',b===btn)})};
  });
  window.addEventListener('resize',resize);
  setInterval(updateClock,10000);
  resize();draw();
})();
</script>
</body>
</html>
